[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-hazards-detection"
version = "1.0.0"
description = "Decoupled Parallel Hybrid Vision & Deep Reinforcement Learning Deceleration Control for ADAS"
readme = "README.md"
authors = [
    { name = "GOURAB BANDHU", email = "Gourab.Bandhu2023@iem.edu.in" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision",
    "opencv-python",
    "numpy",
    "matplotlib",
    "pandas",
    "fpdf2",
    "albumentations",
    "segmentation-models-pytorch",
    "pyttsx3",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
